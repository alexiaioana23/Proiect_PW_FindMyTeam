{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">
        Suspend User
    </h1>

    <div class="card bg-black text-light">

        <div class="card-body">

            <h2>
                {{ suspended_user.username }}
            </h2>

            {% if already_suspended %}

                <div class="alert alert-warning">

                    This user is already suspended.

                </div>

            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Suspension Duration (days)
                    </label>

                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Suspension Reason
                    </label>

                    <textarea
                        name="reason"
                        class="form-control"
                        required
                    ></textarea>

                </div>

                <button
                    class="btn btn-danger"
                    type="submit"
                >

                    {% if already_suspended %}

                        Extend Suspension

                    {% else %}

                        Suspend Account

                    {% endif %}

                </button>

            </form>

            {% if already_suspended %}

                <form
                    method="post"
                    class="mt-3"
                >

                    {% csrf_token %}

                    <input
                        type="hidden"
                        name="action"
                        value="unsuspend"
                    >

                    <button
                        class="btn btn-success"
                    >
                        Remove Suspension
                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
