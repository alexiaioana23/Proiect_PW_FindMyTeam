{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card bg-dark text-light p-4">

        <h1>Password Reset</h1>

        <p>
            Enter your email and we will send you
            a reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Reset Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
