{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card bg-dark text-light p-4">

        <h1>Change Password</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-warning"
            >
                Change Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
