{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card bg-dark text-light p-4">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

        <br>

        <a href="/accounts/password_reset/">
            Forgot Password?
        </a>

    </div>

</div>

{% endblock %}
