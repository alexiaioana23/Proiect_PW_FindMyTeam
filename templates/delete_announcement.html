{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card bg-dark border-danger">

        <div class="card-body text-center">

            <h2 class="text-danger mb-4">

                Delete Announcement

            </h2>

            <p>

                Are you sure you want to
                permanently delete:

            </p>

            <h4>

                "{{ announcement.title }}"

            </h4>

            <form method="post">

                {% csrf_token %}

                <button
                    class="btn btn-danger mt-3"
                >
                    Confirm Delete
                </button>

                <a
                    href="/announcements/reports/"
                    class="btn btn-secondary mt-3"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
