{% extends 'base.html' %}

{% block content %}

<h1>{{ announcement.title }}</h1>

<p>{{ announcement.category }}</p>

<p>{{ announcement.content }}</p>

<p>Posted by: {{ announcement.author.username }}</p>

<p>{{ announcement.created_at }}</p>

<p>
    Posted on:
    {{ announcement.created_at }}
</p>

<a
    href="/announcements/report/{{ announcement.id }}/"
    class="btn btn-danger"
>
    Report Announcement
</a>
    
{% endblock %}
