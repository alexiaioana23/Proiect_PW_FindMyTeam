{% extends 'base.html' %}

{% block content %}

<div class="card bg-black text-light p-4">

    <h2 class="mb-4">

        Chat with {{ other_user.username }}

    </h2>

    <div
        class="
            border
            rounded
            p-3
            mb-4
            bg-dark
        "
        style="
            height: 500px;
            overflow-y: auto;
        "
    >

        {% for message in messages_list %}

            <div class="
                d-flex
                mb-3

                {% if message.sender == request.user %}
                    justify-content-end
                {% else %}
                    justify-content-start
                {% endif %}
            ">

                <div
                    class="
                        p-3
                        rounded
                    "

                    style="
                        max-width: 70%;
                        background-color:
                        {% if message.sender == request.user %}
                            #0d6efd
                        {% else %}
                            #343a40
                        {% endif %};
                    "
                >

                    <small class="fw-bold">

                        {{ message.sender.username }}

                    </small>

                    <br>

                    {{ message.content }}

                    <br>

                    <small class="text-light">

                        {{ message.timestamp|date:"M d, H:i" }}

                    </small>

                </div>

            </div>

        {% endfor %}

    </div>

    <form method="post">

        {% csrf_token %}

        <div class="input-group">

            <input
                type="text"
                name="content"
                class="form-control"
                placeholder="Type a message..."
                required
            >

            <button class="btn btn-primary">

                Send

            </button>

        </div>

    </form>

</div>

{% endblock %}
